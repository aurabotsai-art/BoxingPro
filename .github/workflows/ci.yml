name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  metrics-core:
    name: Rust workspace (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check --all
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  content:
    name: Content (fault/drill cross-reference lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/lint_content.py

  contracts:
    name: Contracts (JSON Schema validity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save ajv-cli@5 ajv-formats@2
      - run: npx ajv compile --spec=draft2020 -c ajv-formats -s "contracts/*.schema.json"
