name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  metrics-core:
    name: Rust workspace (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check --all
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  content:
    name: Content (fault/drill cross-reference lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml  # strict YAML validity pass in the linter
      - run: python3 tools/lint_content.py
      - name: Drill snapshot must match the content library
        run: |
          python3 tools/gen_drill_lib.py
          git diff --exit-code web/lib/session/drills.gen.ts

  contracts:
    name: Contracts (JSON Schema validity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save ajv-cli@5 ajv-formats@2
      - run: npx ajv compile --spec=draft2020 -c ajv-formats -s "contracts/*.schema.json"

  pipeline:
    name: Full-chain contract check (archive → analysis → coach)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install jsonschema pyyaml scikit-learn
      - run: tools/pipeline_check.sh
      - name: Golden-clip regression (synthetic seeds)
        run: python3 tools/golden/run_golden.py
      - name: Training-pipeline dry run (3-class synthetic plumbing)
        run: tools/train/dry_run.sh

  web:
    name: Web app (production build, mirrors Vercel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      # Same command Vercel runs (vercel.json buildCommand): stages MediaPipe
      # wasm + pose model + core wasm into public/, then next build.
      - run: npm run vercel-build
        working-directory: web
      - name: First-load JS budget (fails on bloat)
        run: node tools/check_bundle_size.mjs
        working-directory: web

  wasm-bindings:
    name: WASM bindings freshness (web/lib/core in sync with core-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p boxingpro-core-wasm --target wasm32-unknown-unknown --release
      - name: Regenerate bindings with the pinned wasm-bindgen
        run: |
          curl -sSfL https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.104/wasm-bindgen-0.2.104-x86_64-unknown-linux-musl.tar.gz | tar xz
          ./wasm-bindgen-0.2.104-x86_64-unknown-linux-musl/wasm-bindgen \
            --target web --out-dir /tmp/bindings \
            target/wasm32-unknown-unknown/release/boxingpro_core_wasm.wasm
      # JS/TS interface files are deterministic for a given exported API, so a
      # diff means someone changed core-wasm without regenerating bindings.
      # (Wasm bytes are compiler-version-sensitive, so only the repo-internal
      # copy consistency is checked, not byte equality with the CI build.)
      - name: Bindings must match the committed interface
        run: |
          diff /tmp/bindings/boxingpro_core_wasm.js web/lib/core/boxingpro_core_wasm.js
          diff /tmp/bindings/boxingpro_core_wasm.d.ts web/lib/core/boxingpro_core_wasm.d.ts
          diff /tmp/bindings/boxingpro_core_wasm_bg.wasm.d.ts web/lib/core/boxingpro_core_wasm_bg.wasm.d.ts
      - name: Staged public wasm must match the committed bindings wasm
        run: cmp web/lib/core/boxingpro_core_wasm_bg.wasm web/public/core/boxingpro_core_wasm_bg.wasm
